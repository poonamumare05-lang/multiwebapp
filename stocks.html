<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShareMarket - Stocks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h2>📈 ShareMarket</h2>
  <nav>
    <a href="index.html">Home</a>
    <a href="stocks.html">Stocks</a>
    <a href="portfolio.html">Portfolio</a>
  </nav>
</header>

<main>
  <h1>Explore Stocks</h1>
  <input type="text" id="search" placeholder="Search stock name...">

  <table>
    <thead>
      <tr><th>Company</th><th>Price</th><th>Change</th><th>Action</th></tr>
    </thead>
    <tbody id="stock-list"></tbody>
  </table>
</main>

<footer>Demo stock prices only — not live market data.</footer>

<script>
const stocks = [
  {name:"Reliance", price:1450, change:"+1.8%"},
  {name:"TCS", price:3200, change:"-0.6%"},
  {name:"Infosys", price:1550, change:"+2.1%"},
  {name:"HDFC Bank", price:1680, change:"+0.9%"},
  {name:"ITC", price:430, change:"-0.4%"}
];

function displayStocks() {
  const query = document.getElementById("search").value.toLowerCase();
  const filtered = stocks.filter(s => s.name.toLowerCase().includes(query));

  document.getElementById("stock-list").innerHTML =
    filtered.map(s => `
      <tr>
        <td>${s.name}</td>
        <td>₹${s.price.toLocaleString("en-IN")}</td>
        <td class="${s.change.startsWith("+") ? "green" : "red"}">${s.change}</td>
        <td><button onclick="saveStock('${s.name}')">Watch</button></td>
      </tr>
    `).join("");
}

function saveStock(name) {
  let watchlist = JSON.parse(localStorage.getItem("watchlist") || "[]");
  if (!watchlist.includes(name)) watchlist.push(name);
  localStorage.setItem("watchlist", JSON.stringify(watchlist));
  alert(name + " saved to your watchlist!");
}

document.getElementById("search").addEventListener("input", displayStocks);
displayStocks();
</script>
</body>
</html>
